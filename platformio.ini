; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
lib_deps = 
	bodmer/TFT_eSPI@^2.5.0
	lvgl/lv_arduino@^3.0.1
	bblanchon/ArduinoJson@^6.20.0
build_flags =
	; ponytail: Flash byte reads use the core handler; use pgm_read_byte in LVGL if rendering becomes too slow.
	-D NON32XFER_HANDLER
	-D USER_SETUP_LOADED=1
	-D LV_CONF_INCLUDE_SIMPLE=1
	-I include
	-include include/TFT_eSPI_Setup.h
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp8266_exception_decoder
build_type = release

; Default: SD2 ST7789 240x240, no chip-select wire.
[env:nodemcuv2]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER

; Original repository wiring: ILI9341, CS=D8, 240x240 viewport.
[env:nodemcuv2_ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_DRIVER
